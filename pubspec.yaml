name: psg_pos
description: "PSG Padmashree Garments — offline-first POS & billing system."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (compile-safe, testable, great for async/offline state)
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Formatting (money, dates) and ids
  intl: ^0.19.0
  uuid: ^4.4.0

  # Structured logging
  logger: ^2.4.0

  # Hashing for PIN/password (PBKDF2-SHA256)
  crypto: ^3.0.5

  # Local offline-first database (source of truth on device)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.4

  # Thermal receipt printing over Bluetooth (ESC/POS 58/80mm)
  print_bluetooth_thermal: ^1.1.1
  esc_pos_utils_plus: ^2.0.4
  permission_handler: ^11.3.1

  # Image decode/resize for rasterising the logo onto the thermal bill
  image: ^4.2.0

  # On-screen UPI payment QR (customer scans it from the tablet screen)
  qr_flutter: ^4.1.0

  # PDF generation (sales reports) and sharing files (export/CA/backup)
  pdf: ^3.11.1
  share_plus: ^10.1.4

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  # Code generation for Drift
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

  # Host-side SQLite for running database tests
  sqlite3: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
