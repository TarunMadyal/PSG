name: Build APK

# Builds an installable Android APK for PSG Padmashree Garments.
# Runs on every push to the development branch and can also be triggered
# manually from the GitHub "Actions" tab (Run workflow button).
on:
  push:
    branches:
      - claude/psg-padmashree-pos-system-mrde8l
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer
        # Info-level lints shouldn't block the shop from getting a build;
        # warnings and errors still fail the job.
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        # Each build gets an increasing version code (the run number) so the
        # app is always seen as an update, and it's signed with the committed
        # keystore so it installs in place without a signature conflict.
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/psg-pos.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: psg-pos-apk
          path: dist/psg-pos.apk

      # Publishes/updates a single "latest-apk" release so there is always a
      # stable link to download the newest build from — easier than digging
      # through Actions artifacts on a phone.
      - name: Publish to "latest-apk" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest PSG POS APK
          body: |
            Latest installable build of the PSG Padmashree Garments POS app.
            Download **psg-pos.apk** below and install it on the shop tablet.
            Installing over an existing version keeps all your data.
          files: dist/psg-pos.apk
